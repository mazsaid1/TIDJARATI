name: Deploy

# Déploiement continu (CD) sur Vercel après un push sur main.
#
# Le job est « dormant » tant que les secrets ne sont pas configurés :
#   Settings → Secrets and variables → Actions → New repository secret
#     - VERCEL_TOKEN      (https://vercel.com/account/tokens)
#     - VERCEL_ORG_ID     (dans .vercel/project.json après `vercel link`)
#     - VERCEL_PROJECT_ID (idem)
#
# Sans ces secrets, le workflow se termine en succès sans rien déployer.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  vercel:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check Vercel configuration
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets Vercel absents — déploiement ignoré. Ajoutez VERCEL_TOKEN, VERCEL_ORG_ID et VERCEL_PROJECT_ID pour l'activer."
          fi

      - name: Checkout
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Deploy to Vercel
        if: steps.guard.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
